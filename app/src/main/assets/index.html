<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آلارم میومیو</title>

<style>
:root{--bg:#8fd3f4;--ink:#1f2a6b;--card:#fffdf4;--pink:#ff6b9a;--sun:#ffd23f;--fg:#1f2a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2145;--ink:#9fb0ff;--card:#2a2f5e;--fg:#f1eefc}}
:root[data-theme="dark"]{--bg:#1d2145;--ink:#9fb0ff;--card:#2a2f5e;--fg:#f1eefc}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(circle at 18% 8%,#ffffff66 0 38px,transparent 39px),radial-gradient(circle at 88% 26%,#ffffff44 0 58px,transparent 59px);color:var(--fg);font-family:Tahoma,Arial,sans-serif;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 14px 28px;font-size:1.05rem}
h1{font-weight:400;font-size:2.3rem;margin:2px 0 10px;color:#fff;text-shadow:3px 3px 0 var(--ink);animation:wig 3s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);width:100%;max-width:560px;margin:0 0 14px;padding:8px;overflow:hidden}
.clock{background:var(--sun);color:#1f2a6b;font-size:4rem;line-height:1.2;text-align:center;direction:ltr;letter-spacing:.06em}
.clockHint{margin:-9px 0 14px;font-size:.86rem;text-align:center}
.native .clock{cursor:pointer}
#pickTime{display:none;font-size:1.08rem;padding:8px 14px}
.native #pickTime{display:inline-block}
.native #at{display:none}
.panel{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px}
.panel label{display:flex;align-items:center;gap:8px}
input[type=time],select{font:inherit;font-size:1.5rem;border:3px solid var(--ink);border-radius:14px;padding:0 10px;background:#fff;color:#1f2a6b;direction:ltr}
select{font-size:1.1rem}
.sw input{position:absolute;opacity:0}
.sw span{width:56px;height:32px;border-radius:16px;background:#c8c8d8;border:3px solid var(--ink);position:relative;display:inline-block;transition:background .2s}
.sw span::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:inset-inline-start .2s}
.sw input:checked+span{background:var(--pink)}
.sw input:checked+span::after{inset-inline-start:26px}
.sw input:focus-visible+span,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
svg{display:block;width:100%;height:auto;touch-action:none;border-radius:14px}
.meter{width:100%;max-width:560px;height:16px;border-radius:8px;border:3px solid var(--ink);background:var(--card);margin:2px 0 10px;overflow:hidden}
#bar{height:100%;width:0;background:var(--pink);transition:width .15s}
#msg{min-height:3.2em;text-align:center;margin:0 0 10px;line-height:1.7;max-width:560px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{font:inherit;border:3px solid var(--ink);border-radius:999px;padding:6px 20px;background:var(--pink);color:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.note{font-size:.85rem;opacity:.8;text-align:center;max-width:460px;margin:14px 0 0;line-height:1.7}
@keyframes flash{from{background-color:var(--bg)}to{background-color:#ff9bb8}}
@keyframes shake{25%{transform:translate(-3px,1px) rotate(-.6deg)}75%{transform:translate(3px,-1px) rotate(.6deg)}}
@keyframes bnc{to{transform:scale(1.08)}}
body.ring{animation:flash .5s infinite alternate}
.ring .scene{animation:shake .3s infinite}
.ring .clock{animation:bnc .5s infinite alternate}
.hint{animation:bnc .5s infinite alternate;transform-box:fill-box;transform-origin:center}
.heart{font-size:15px;fill:#e0607e;animation:up 1.6s ease-out forwards}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-38px)}}
.z{font-weight:700;fill:#1f2a6b;opacity:0;animation:zz 2.6s infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-20px)}}
.sm{fill:#c3ccdb;stroke:#8f9bb3;stroke-width:1;transform-box:fill-box;transform-origin:center;animation:sm 2.8s ease-out forwards}
@keyframes sm{from{opacity:.9;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx,30px),-46px) scale(2.8)}}
.kb{fill:#a86b3c;stroke:none;animation:fall .5s ease-in forwards}
@keyframes fall{to{transform:translate(var(--fx,0),var(--fy,60px))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}.z{opacity:1}}
</style>
</head>

<div class="row"><button id="test">تست (۵ ثانیه دیگه)</button><button id="snd">صدا: روشن</button></div>
<p class="note">در حالت عادی، آلارم حتی وقتی برنامه بسته یا صفحه خاموش است اجرا می‌شود. برای اطمینان، مجوز اعلان تمام‌صفحه را فعال نگه دار.</p>
<script>
const $=id=>document.getElementById(id),svg=$('s'),SH={x:112,y:140},HEAD={x:238,y:222},REST={x:150,y:190},MOUTH={x:138,y:113},NS='http://www.w3.org/2000/svg';
const NATIVE=typeof Android!=='undefined';
if(NATIVE){document.documentElement.classList.add('native');$('clockHint').textContent='ساعت فعلی — برای تنظیم آلارم این ساعت را لمس کن';}
let P=null,hand={x:150,y:190},lvl=100,sleep=true,state=-1,lastPet=-9,lastHeart=0,last=null,dip=0,muted=false,aud=null,ph=null,mb=0,lastPuff=0,nextMeow=1,meowEnd=0,mode='idle',snoozeEnd=0,ringStart=0,testAt=0,fired='',alarmOn=false,lastMsg='',curPt=-1,done=false,food=0,fill=0,fedAt=0,sleepAt=0,bagRot=0,lastKib=0,smoked=false;
const pt0=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
const inCat=p=>((p.x-292)/90)**2+((p.y-232)/52)**2<1;
function initAudio(){if(aud||muted)return;try{
  const c=new(window.AudioContext||window.webkitAudioContext)(),b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=c.createBufferSource();src.buffer=b;src.loop=true;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=430;
  const am=c.createGain();am.gain.value=.65;
  const lfo=c.createOscillator();lfo.frequency.value=25;const lg=c.createGain();lg.gain.value=.5;lfo.connect(lg);lg.connect(am.gain);
  const m=c.createGain();m.gain.value=0;src.connect(lp);lp.connect(am);am.connect(m);m.connect(c.destination);
  src.start();lfo.start();aud={c,m};vol();}catch(e){}}
function vol(){if(!aud)return;aud.c.resume&&aud.c.resume();aud.m.gain.setTargetAtTime(muted?0:[0,.7,0][state<0?0:state],aud.c.currentTime,.3)}
function meow(vl=1){if(NATIVE||!aud||muted)return;aud.c.resume&&aud.c.resume();const c=aud.c,s=c.currentTime+.02,o=c.createOscillator(),g=c.createGain(),f1=c.createBiquadFilter(),f2=c.createBiquadFilter(),g1=c.createGain(),g2=c.createGain(),lp=c.createBiquadFilter(),v=c.createOscillator(),vg=c.createGain();
  const fr=o.frequency;fr.setValueAtTime(420,s);fr.linearRampToValueAtTime(720,s+.18);fr.linearRampToValueAtTime(600,s+.4);fr.linearRampToValueAtTime(340,s+.68);
  v.frequency.value=7;vg.gain.value=10;v.connect(vg);vg.connect(fr);
  o.type='sawtooth';f1.type=f2.type='bandpass';f1.Q.value=f2.Q.value=5;
  f1.frequency.setValueAtTime(600,s);f1.frequency.linearRampToValueAtTime(1000,s+.2);f1.frequency.linearRampToValueAtTime(700,s+.65);
  f2.frequency.setValueAtTime(1800,s);f2.frequency.linearRampToValueAtTime(2500,s+.2);f2.frequency.linearRampToValueAtTime(1500,s+.65);
  g1.gain.value=1;g2.gain.value=.6;lp.type='lowpass';lp.frequency.value=3200;
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.4*vl,s+.1);g.gain.linearRampToValueAtTime(.3*vl,s+.4);g.gain.linearRampToValueAtTime(0,s+.7);
  o.connect(f1);o.connect(f2);f1.connect(g1);f2.connect(g2);g1.connect(lp);g2.connect(lp);lp.connect(g);g.connect(c.destination);
  o.start(s);v.start(s);o.stop(s+.72);v.stop(s+.72)}
// A clear, short "putt-putt" when the cat finishes eating.
function feedSound(){
  if(muted)return;
  initAudio();
  if(!aud)return;
  const c=aud.c;
  c.resume&&c.resume();
  const start=c.currentTime+.02;
  for(let i=0;i<3;i++){
    const t=start+i*.16,osc=c.createOscillator(),gain=c.createGain();
    osc.type='triangle';
    osc.frequency.setValueAtTime(420-i*48,t);
    osc.frequency.exponentialRampToValueAtTime(180-i*18,t+.13);
    gain.gain.setValueAtTime(.001,t);
    gain.gain.exponentialRampToValueAtTime(.72,t+.015);
    gain.gain.exponentialRampToValueAtTime(.001,t+.16);
    osc.connect(gain);gain.connect(c.destination);
    osc.start(t);osc.stop(t+.17);
  }
}
function setState(s){state=s;
  $('cOpen').style.display=s===0?'':'none';$('cHappy').style.display=s===1?'':'none';$('cSleep').style.display=s===2?'':'none';
  $('zs').style.display=s===2?'':'none';vol();}
svg.addEventListener('pointerdown',e=>{initAudio();P=pt0(e)});
svg.addEventListener('pointermove',e=>{const p=pt0(e);
  if(!ph&&!sleep&&P&&inCat(p)){const d=Math.min(Math.hypot(p.x-P.x,p.y-P.y),40);if(d>0.5){lastPet=performance.now()/1000;lvl=Math.min(100,lvl+d*.1)}}
  P=p});
svg.addEventListener('pointerleave',()=>{P=null});
svg.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')P=null});
svg.addEventListener('pointercancel',()=>{P=null});
$('snd').onclick=()=>{muted=!muted;$('snd').textContent='صدای خرخر: '+(muted?'خاموش':'روشن');if(!muted)initAudio();vol()};
function mk(tag,cls,at,txt,ms){const e=document.createElementNS(NS,tag);e.setAttribute('class',cls);for(const k in at)e.setAttribute(k,at[k]);if(txt)e.textContent=txt;$('fx').appendChild(e);setTimeout(()=>e.remove(),ms);return e}
const heart=()=>mk('text','heart',{x:HEAD.x-20+Math.random()*50,y:HEAD.y-36},'♥',1600);
function puff(x,y,dx){mk('circle','sm',{cx:x,cy:y,r:5},0,2800).style.setProperty('--dx',dx+'px')}
function lid(id,x,y){const w=Math.sqrt(121-(y-87)**2);$(id).setAttribute('d',`M${x-w} ${y}A11 11 0 ${y>87?1:0} 1 ${x+w} ${y}Z`)}
function frame(ts){const t=ts/1000,dt=Math.min(.05,t-(last??t));last=t;
  const petting=t-lastPet<.35;
  if(mode==='ringing'&&!petting)lvl=Math.max(0,lvl-6*dt);
  if(mode==='ringing'&&lvl>=100){mode='snooze';sleep=true;ph=null;snoozeEnd=Date.now()+60000;sleepAt=t;smoked=false;food=0;fill=0;if(NATIVE){Android.silence();Android.ringIn(60)}}
  if(mode==='snooze'&&!smoked&&t-sleepAt>1.6){smoked=true;ph={t0:t}}
  if(!NATIVE&&mode==='snooze'&&Date.now()>=snoozeEnd){mode='ringing';sleep=false;lvl=0;ph=null;food=0;fill=0;ringStart=t;nextMeow=t+.4}
  if(mode==='fed'&&t-fedAt>4){mode='idle';sleep=true;lvl=100}
  let pt=ph?t-ph.t0:-1;
  if(ph){
    if(pt>=8){ph=null;state=-1;pt=-1;food=1;fill=0}
  }
  curPt=pt;const s=sleep?2:lvl>=22?1:0;if(s!==state)setState(s);updUI(pt);
  
  // hand
  let tg=ph?(pt>.6&&pt<6.6?MOUTH:REST):(P||REST);tg={x:tg.x,y:tg.y};
  const dx=tg.x-SH.x,dy=tg.y-SH.y,r=Math.hypot(dx,dy);if(r>155){tg.x=SH.x+dx/r*155;tg.y=SH.y+dy/r*155}
  if(petting&&!ph)tg.x+=Math.sin(t*14)*3;
  const k=Math.min(1,dt*(ph?7:12));hand.x+=(tg.x-hand.x)*k;hand.y+=(tg.y-hand.y)*k;
  const hx=hand.x-SH.x,hy=hand.y-SH.y,d=Math.max(20,Math.min(Math.hypot(hx,hy),155)),L=Math.max(44,Math.min(78,d*.6)),
    a=Math.acos(Math.min(1,d/(2*L))),b=Math.atan2(hy,hx)+a,ex=SH.x+Math.cos(b)*L,ey=SH.y+Math.sin(b)*L;
  const set=(id,x1,y1,x2,y2)=>{const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)};
  set('u0',SH.x,SH.y,ex,ey);set('u1',SH.x,SH.y,ex,ey);set('f0',ex,ey,hand.x,hand.y);set('f1',ex,ey,hand.x,hand.y);
  $('hd').setAttribute('cx',hand.x);$('hd').setAttribute('cy',hand.y);
  const bagOn=food===1&&mode==='snooze',pour=bagOn&&P&&((P.x-200)/50)**2+((P.y-252)/46)**2<1;
  bagRot+=((pour?100:0)-bagRot)*Math.min(1,dt*8);
  $('bag').style.display=bagOn?'':'none';$('bag').setAttribute('transform',`translate(${hand.x} ${hand.y}) rotate(${bagRot})`);
  if(pour&&t-lastKib>.07){lastKib=t;const q=bagRot*Math.PI/180,kx=hand.x+10*Math.sin(q),ky=hand.y-10*Math.cos(q),e=mk('circle','kb',{cx:kx,cy:ky,r:2.4},0,520);
    e.style.setProperty('--fy',(276-ky)+'px');e.style.setProperty('--fx',(192+Math.random()*16-kx)+'px');fill=Math.min(100,fill+2.4)}
  const kb=$('kib');kb.style.display=fill>0?'':'none';kb.setAttribute('rx',4+17*fill/100);kb.setAttribute('ry',1+8*fill/100);
  $('bowl').style.display=food===1||mode==='fed'||(done&&mode==='idle')?'':'none';
  if(fill>=100&&mode==='snooze'){mode='fed';food=0;fedAt=t;done=true;sleep=false;lvl=45;ph=null;feedSound();if(NATIVE)Android.dismiss()}
  // cigarette
  mb+=((ph&&pt>.6&&pt<6.6?1:0)-mb)*Math.min(1,dt*5);
  const ang=-35*(1-mb);

  $('emb').style.display=ph&&pt>2?'':'none';$('emb').setAttribute('r',2.4+((pt>2.2&&pt<3.3)||(pt>4.6&&pt<5.4)?1.2:0)+Math.sin(t*9)*.3);
  $('fl').style.display=ph&&pt>1.4&&pt<2.2?'':'none';$('fl').setAttribute('r',3+Math.random()*2.5);
  if(ph){const m=(pt>3.3&&pt<4.6)||(pt>5.4&&pt<6.6),w=pt>=6.8;

  // man face
  const happy=state>=1&&!ph,exh=ph&&((pt>3.3&&pt<4.6)||(pt>5.4&&pt<6.6)),ly=ph&&pt>.4&&pt<8?88:84;
  $('mEyesOpen').style.display=happy?'none':'';$('mEyesHappy').style.display=happy?'':'none';

  $('pl').setAttribute('cx',97+ox);$('pl').setAttribute('cy',87+oy);$('pr').setAttribute('cx',123+ox);$('pr').setAttribute('cy',87+oy);

  dip+=((sleep?(ph&&pt>5.8?5:9):state===1?3:0)-dip)*Math.min(1,dt*3);

  requestAnimationFrame(frame)}
const two=n=>String(n).padStart(2,'0'),fmt=ms=>{const q=Math.ceil(ms/1000);return Math.floor(q/60)+':'+two(q%60)};
function updUI(pt){
  document.body.classList.toggle('ring',mode==='ringing');

  if(m!==lastMsg){$('msg').textContent=m;lastMsg=m}
  $('bar').style.width=(mode==='ringing'?lvl:mode==='snooze'?(food===1?fill:100*rem/60000):mode==='fed'?100:0)+'%';
  const h=$('hint');h.style.display=food===1&&fill<15&&mode==='snooze'?'':'none';h.setAttribute('cx',200);h.setAttribute('cy',262);h.setAttribute('r',34)}
function updatePickedTime(){$('pickTime').textContent='⏰ '+$('at').value+' · تغییر ساعت'}
function save(){updatePickedTime();if(NATIVE){const q=$('at').value.split(':');Android.setAlarm(+q[0],+q[1],alarmOn)}try{localStorage.setItem('mm',JSON.stringify({at:$('at').value,on:alarmOn}))}catch(e){}}
try{
  // SharedPreferences is the source of truth on Android. localStorage is used
  // only for the standalone browser demo; never overwrite saved native alarms.
  const d=NATIVE?JSON.parse(Android.getAlarmState()):JSON.parse(localStorage.getItem('mm')||'{}');
  if(NATIVE){$('at').value=two(d.h)+':'+two(d.m)}
  else if(d.at){$('at').value=d.at}
  alarmOn=!!d.on;
  $('on').checked=alarmOn;
}catch(e){console.error('Unable to load alarm preferences',e)}
updatePickedTime();
window.onNativeTimePicked=(h,m)=>{
  $('at').value=two(h)+':'+two(m);

};
function openAlarmTime(){if(NATIVE)Android.pickTime();else $('at').focus()}

if(NATIVE){

$('at').onchange=save;
$('on').onchange=()=>{alarmOn=$('on').checked;done=false;fired='';initAudio();save();lock()};

document.addEventListener('pointerdown',initAudio);

setInterval(()=>{const n=new Date(),hm=two(n.getHours())+':'+two(n.getMinutes());$('clock').textContent=hm;
