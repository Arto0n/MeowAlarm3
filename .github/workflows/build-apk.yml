name: Build MeowAlarm APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # setup-android puts sdkmanager on PATH and sets ANDROID_HOME.
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar" || {
            echo "Android SDK Platform 34 is missing from $ANDROID_HOME" >&2
            exit 1
          }
          sdkmanager --list_installed

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate repository layout
        shell: bash
        run: |
          test -f settings.gradle.kts || {
            echo "Upload the CONTENTS of the project folder to the repository root." >&2
            echo "settings.gradle.kts should be beside the .github directory." >&2
            exit 1
          }
          test -f app/build.gradle.kts

      - name: Check source structure and JavaScript
        run: python3 tests/verify_sources.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowAlarm-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
