name: Build MeowAlarm APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager not found at $SDKMANAGER"
            exit 1
          fi

          "$SDKMANAGER" --version

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          test -f "$ANDROID_HOME/platforms/android-34/android.jar"

          "$SDKMANAGER" --list_installed



      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate repository layout
        shell: bash
        run: |
          test -f settings.gradle.kts || {
            echo "Upload the CONTENTS of the project folder to the repository root." >&2
            echo "settings.gradle.kts should be beside the .github directory." >&2
            exit 1
          }
          test -f app/build.gradle.kts

      - name: Check source structure and JavaScript
        run: python3 tests/verify_sources.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowAlarm-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
